[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fishops-database"
version = "0.1.0"
description = "FishOps Prospecting & Relationship Intelligence System for aquaculture value chains"
requires-python = ">=3.11"
dependencies = [
    "alembic==1.17.2",
    "Authlib==1.6.5",
    "beautifulsoup4==4.15.0",
    "lxml==6.1.3",
    "pandas==3.1.1",
    "psycopg2-binary==2.9.13",
    "python-dotenv==1.2.4",
    "requests==2.34.2",
    "sqlalchemy==2.1.9",
    "streamlit==1.67.0",
    "supabase==2.34.1",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
